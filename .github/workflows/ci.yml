name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.6.14"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Use echo-only config for tests
        run: |
          printf 'default_backend: echo\nbackends:\n  echo:\n    type: echo\n' > config.yaml

      - name: Run tests
        run: uv run python test_gateway.py
